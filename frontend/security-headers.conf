# En-têtes de sécurité, inclus dans chaque location : nginx n'hérite pas des add_header du
# niveau server dès qu'une location en déclare un.
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy no-referrer always;
# HTTPS est terminé en amont ; le navigateur ignore cet en-tête reçu en HTTP.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy same-origin always;
# Aucun script ni style externe ou en ligne. Seul le PDF de licence, servi par le bucket S3
# (adresse propre à chaque déploiement), est affiché dans une iframe : frame-src https:.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src https:; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
