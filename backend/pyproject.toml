[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lsoc-backend"
version = "0.1.0"
description = "API de gestion des plannings du LSOC"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.32,<1",
  "sqlalchemy>=2.0.36,<3", "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2", "pydantic-settings>=2.6,<3",
  "email-validator>=2.2,<3", "argon2-cffi>=23.1,<26",
  "httpx>=0.28,<1", "beautifulsoup4>=4.12,<5",
  "cryptography>=44,<47",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.8,<1", "mypy>=1.13,<2", "types-beautifulsoup4", "aiosmtpd>=1.4,<2"]

[project.scripts]
lsoc = "app.cli:main"
lsoc-worker = "app.jobs.worker:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
